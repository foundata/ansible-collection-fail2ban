## Backend package installation mapping

- name: "Molecule | Verify | Check backend package installation mapping"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat'
  block:

    - name: "Install dependencies needed for package_facts on Fedora"
      ansible.builtin.package:
        name:
          - "python3-rpm"
          - "python3-libdnf5"
        state: "present"
      when:
        - (ansible_facts['distribution'] | ansible.builtin.lower) == 'fedora'


    - name: "Molecule | Verify | Gather package facts"
      ansible.builtin.package_facts:
        manager: "auto"


    - name: "Molecule | Verify | Assert backend-specific package is installed on Red Hat platforms"
      ansible.builtin.assert:
        that:
          - "'python3-inotify' in ansible_facts['packages']"
        fail_msg: >-
          The backend-specific package 'python3-inotify' is not installed even though the
          'pyinotify' backend is configured for the dropbear jail.
        success_msg: >-
          The backend-specific package 'python3-inotify' is installed as expected.


## Init-only merged variable evaluation
#
# Re-run the role's init with controlled inputs and assert the merged variables
# directly (whether materialized in tasks/init.yml or lazily in vars/main.yml):
# the user settings must win, the defaults and the (RedHat-family) platform
# override must survive, and the detected backends must reflect the merged jail
# settings.
#
# Inputs are set via set_fact so they outrank the converge-time facts restored
# at the top of this file and stay in scope when the assertions dereference the
# (lazily evaluated) effective variables.

- name: "Molecule | Verify | Validate effective merged variables (init-only)"
  block:

    - name: "Molecule | Verify | Set controlled inputs for the merge checks"
      ansible.builtin.set_fact:
        run_fail2ban_service_settings:
          DEFAULT:
            loglevel: "DEBUG"
        run_fail2ban_jail_settings:
          myjail:
            enabled: true
            backend: "polling"
            port: "1234"

    - name: "Molecule | Verify | Re-initialize fail2ban with controlled inputs"
      ansible.builtin.include_role:
        name: "foundata.fail2ban.run"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert effective service settings merged correctly"
      ansible.builtin.assert:
        that:
          - __run_fail2ban_effective_service_settings['DEFAULT']['loglevel'] == "DEBUG"
        fail_msg: "__run_fail2ban_effective_service_settings did not merge the user service settings as expected."
        success_msg: "__run_fail2ban_effective_service_settings merged the user service settings correctly."


    - name: "Molecule | Verify | Assert effective jail settings merged correctly"
      ansible.builtin.assert:
        that:
          # an untouched default survives
          - __run_fail2ban_effective_jail_settings['DEFAULT']['ignoreself'] | ansible.builtin.bool
          # a default-managed jail survives
          - __run_fail2ban_effective_jail_settings['sshd']['enabled'] | ansible.builtin.bool
          # the user-supplied jail is added
          - __run_fail2ban_effective_jail_settings['myjail']['port'] == "1234"
        fail_msg: "__run_fail2ban_effective_jail_settings did not merge defaults and user settings as expected."
        success_msg: "__run_fail2ban_effective_jail_settings merged defaults and user settings correctly."

    - name: "Molecule | Verify | Assert RedHat-family platform overwrite is present in jail settings"
      ansible.builtin.assert:
        that:
          # banaction is overridden only by the RedHat-family platform overwrite
          # (vars/redhat.yml); other families keep the nftables default, so this
          # check is gated to the RedHat family.
          - __run_fail2ban_effective_jail_settings['DEFAULT']['banaction'] == "firewallcmd-rich-rules"
        fail_msg: "__run_fail2ban_effective_jail_settings did not include the RedHat-family banaction overwrite."
        success_msg: "__run_fail2ban_effective_jail_settings includes the RedHat-family banaction overwrite."
      when:
        - ansible_facts['os_family'] == "RedHat"


    - name: "Molecule | Verify | Assert detected backends reflect the merged jail settings"
      ansible.builtin.assert:
        that:
          # DEFAULT.backend default
          - "'systemd' in __run_fail2ban_detected_backends"
          # user jail backend
          - "'polling' in __run_fail2ban_detected_backends"
        fail_msg: "__run_fail2ban_detected_backends did not reflect the merged jail settings."
        success_msg: "__run_fail2ban_detected_backends correctly reflects the merged jail settings."


## Configuration validation before restart
#
# The role notifies a validation handler before the restart handler, so a broken
# configuration must fail the run while the daemon keeps serving the previous
# one. Without that guard the restart handler would activate whatever was
# written and take the protection down.
#
# Plant a jail that references a filter which does not exist (the failure mode
# a typo in "filter" produces), flush the handlers and expect the validation to
# fail. The file is removed again in "always", so the remaining tasks and the
# cleanup stage see the managed configuration.

- name: "Molecule | Verify | Validate that a broken configuration cannot reach the service (integration)"
  vars:
    __testing_broken_jail_path: "{{ __run_fail2ban_config_jail_dropin_dir_path }}/00-molecule-broken.local"
  block:

    - name: "Molecule | Verify | Plant a jail referencing a filter that does not exist"
      ansible.builtin.copy:
        content: |
          [molecule-broken]
          enabled = true
          filter = molecule-filter-that-does-not-exist
        dest: "{{ __testing_broken_jail_path }}"
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644
      notify:
        - "run_fail2ban: validate configuration"
        - "run_fail2ban: restart fail2ban.service"

    - name: "Molecule | Verify | Run the validation handler against the broken configuration"
      ansible.builtin.meta: flush_handlers

    - name: "Molecule | Verify | Fail because the broken configuration was accepted"
      ansible.builtin.fail:
        msg: >-
          The configuration validation accepted a jail referencing a non-existent filter,
          so a broken configuration would reach the service restart.

  rescue:

    - name: "Molecule | Verify | Assert the run failed in the validation handler"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('Validate Fail2ban configuration')
        fail_msg: >-
          The run failed, but not in the validation handler as expected
          (failed task: '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "A broken configuration is rejected by the validation handler before the service is restarted."

  always:

    - name: "Molecule | Verify | Remove the broken jail again"
      ansible.builtin.file:
        path: "{{ __testing_broken_jail_path }}"
        state: "absent"
