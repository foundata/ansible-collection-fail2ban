# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __run_fail2ban_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__run_fail2ban_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__run_fail2ban_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __run_fail2ban_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is ansible.builtin.version(__run_fail2ban_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__run_fail2ban_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __run_fail2ban_supported_platforms }}
  vars:
    __run_fail2ban_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __run_fail2ban_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __run_fail2ban_matched_versions: >-
      {{
        __run_fail2ban_supported_platforms
        | ansible.builtin.selectattr('name', 'ansible.builtin.match', __run_fail2ban_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('ansible.builtin.match', __run_fail2ban_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__run_fail2ban_supported_platforms | ansible.builtin.length) > 0
    - (__run_fail2ban_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __run_fail2ban_platform_filenames_raw:
      - "{{ __run_fail2ban_dist }}_{{ __run_fail2ban_dist_ver }}.yml"
      - "{{ __run_fail2ban_dist }}_{{ __run_fail2ban_dist_major }}.yml"
      - "{{ __run_fail2ban_dist }}.yml"
      - "{{ __run_fail2ban_os_family }}.yml"
  vars:
    __run_fail2ban_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_fail2ban_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_fail2ban_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_fail2ban_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __run_fail2ban_platform_filenames_most_specific_first: >-
      {{
        (__run_fail2ban_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __run_fail2ban_platform_filenames_most_specific_last: >-
      {{
        __run_fail2ban_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __run_fail2ban_vars_file }}"
  vars:
    __run_fail2ban_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __run_fail2ban_vars_file is ansible.builtin.file
  loop: "{{ __run_fail2ban_platform_filenames_most_specific_last }}"


### fail2ban specific


- name: "Init | Show effective merged variables (computed lazily in vars/main.yml)"
  ansible.builtin.debug:
    msg: "{{ __run_fail2ban_effective_var }} = {{ lookup('ansible.builtin.vars', __run_fail2ban_effective_var) }}"
    verbosity: 3
  loop:
    - "__run_fail2ban_effective_service_settings"
    - "__run_fail2ban_effective_jail_settings"
    - "__run_fail2ban_detected_backends"
  loop_control:
    loop_var: "__run_fail2ban_effective_var"
    label: "{{ __run_fail2ban_effective_var }}"


# The basename of a custom filter or action file is not cosmetic: it is the name
# jails refer to via "filter = <name>" / "action = <name>". Silently normalizing
# a key therefore produces a file the jail cannot resolve, and two keys that
# normalize to the same name overwrite each other without a trace. Reject such
# keys instead, so the file always lands exactly where the reference expects it.
- name: "Init | Assert custom filter and action names are usable as filenames"
  ansible.builtin.assert:
    that:
      - (__run_fail2ban_name_normalized | ansible.builtin.length) > 0
      - __run_fail2ban_name_normalized == __run_fail2ban_name_item['key']
    fail_msg: >-
      The {{ __run_fail2ban_name_item['kind'] }} name '{{ __run_fail2ban_name_item['key'] }}' cannot be
      used as a filename. Fail2ban resolves '{{ __run_fail2ban_name_item['kind'] }} = <name>' against the
      file of the same name, so only lowercase letters, digits, '.', '_' and '-' are allowed
      (it would become '{{ __run_fail2ban_name_normalized }}').
    success_msg: >-
      The {{ __run_fail2ban_name_item['kind'] }} name '{{ __run_fail2ban_name_item['key'] }}' is usable
      as a filename.
  vars:
    __run_fail2ban_name_normalized: >-
      {{
        __run_fail2ban_name_item['key']
        | ansible.builtin.lower
        | ansible.builtin.regex_replace('[^a-z0-9._-]', '_')
        | ansible.builtin.regex_replace('_+', '_')
        | ansible.builtin.regex_replace('^_|_$', '')
      }}
  loop: >-
    {{
      ((run_fail2ban_custom_filters | ansible.builtin.default({}) | ansible.builtin.dict2items)
       | ansible.builtin.map('ansible.builtin.combine', {'kind': 'filter'}) | ansible.builtin.list)
      +
      ((run_fail2ban_custom_actions | ansible.builtin.default({}) | ansible.builtin.dict2items)
       | ansible.builtin.map('ansible.builtin.combine', {'kind': 'action'}) | ansible.builtin.list)
    }}
  loop_control:
    loop_var: "__run_fail2ban_name_item"
    label: "{{ __run_fail2ban_name_item['kind'] }}: {{ __run_fail2ban_name_item['key'] }}"


# The drop-in filenames get concatenated into paths below the fail2ban.d and
# jail.d configuration directories. A value containing a path separator or
# leading dots (such as '../jail.conf') would make the role write to or remove
# files outside of those directories with root privileges. Fail2ban also only
# reads files ending in '.conf' or '.local' from these directories (cf.
# man jail.conf), so any other suffix would silently never be applied.
- name: "Init | Assert the drop-in filenames are safe basenames ending in '.conf' or '.local'"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', __run_fail2ban_filename_var) is ansible.builtin.match('^[A-Za-z0-9][A-Za-z0-9._-]*\.(conf|local)$')
    fail_msg: >-
      '{{ __run_fail2ban_filename_var }}' ({{ lookup('ansible.builtin.vars', __run_fail2ban_filename_var) }})
      has to be a plain filename ending in '.conf' or '.local', starting with an
      alphanumeric character and containing only characters from 'A-Za-z0-9._-'
      (no path separators).
    success_msg: >-
      '{{ __run_fail2ban_filename_var }}' is a safe basename.
  loop:
    - "run_fail2ban_config_service_dropin_file_name"
    - "run_fail2ban_config_jail_dropin_file_name"
  loop_control:
    loop_var: "__run_fail2ban_filename_var"
    label: "{{ __run_fail2ban_filename_var }}"
