# Install: Manage basic resource setup, such as packages or service users.
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---

- name: "Setup | Install | Default | Remove unwanted packages (e.g., to prevent conflicts or resolve incompatibilities)"
  ansible.builtin.package:
    name: "{{ __run_fail2ban_packages_removal }}"
    state: "absent"
  when:
    - __run_fail2ban_packages_removal is ansible.builtin.defined
    - (__run_fail2ban_packages_removal | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Install or upgrade packages"
  ansible.builtin.package:
    name: "{{ __run_fail2ban_packages_install }}"
    state: "{{ 'latest' if (run_fail2ban_autoupgrade | ansible.builtin.bool) else 'present' }}"
  when:
    - __run_fail2ban_packages_install is ansible.builtin.defined
    - (__run_fail2ban_packages_install | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Install backend-specific packages"
  ansible.builtin.package:
    name: "{{ __run_fail2ban_packages_install_map_backends[__run_fail2ban_backend_item] }}"
    state: "{{ 'latest' if (run_fail2ban_autoupgrade | ansible.builtin.bool) else 'present' }}"
  loop: >-
    {{
      __run_fail2ban_detected_backends
      | ansible.builtin.default([])
      | ansible.builtin.select('ansible.builtin.in', __run_fail2ban_packages_install_map_backends.keys() | ansible.builtin.list)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__run_fail2ban_backend_item"
  when:
    - (__run_fail2ban_detected_backends | ansible.builtin.default([]) | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Remove unwanted files and directories (e.g., to prevent conflicts or resolve incompatibilities)"
  ansible.builtin.file:
    path: "{{ __run_fail2ban_removal_path_item }}"
    state: "absent"
  when:
    - __run_fail2ban_paths_removal is ansible.builtin.defined
    - (__run_fail2ban_paths_removal | ansible.builtin.length) > 0
  loop: "{{ __run_fail2ban_paths_removal }}"
  loop_control:
    loop_var: "__run_fail2ban_removal_path_item"


- name: "Setup | Install | Default | Neutralize distribution config files (overwrite to survive package updates)"
  ansible.builtin.copy:
    dest: "{{ __run_fail2ban_neutralize_item['key'] }}"
    content: |
      {{ __run_fail2ban_neutralize_item['value'] }} Managed by Ansible (foundata.fail2ban.run)
      {{ __run_fail2ban_neutralize_item['value'] }}
      {{ __run_fail2ban_neutralize_item['value'] }} Content intentionally cleared. The original distribution file conflicted
      {{ __run_fail2ban_neutralize_item['value'] }} with configuration managed by the foundata.fail2ban.run role.
      {{ __run_fail2ban_neutralize_item['value'] }}
      {{ __run_fail2ban_neutralize_item['value'] }} To restore the original file content, reinstall the owning package:
      {% if (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian' %}
      {{ __run_fail2ban_neutralize_item['value'] }}   dpkg -S '{{ __run_fail2ban_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_fail2ban_neutralize_item['value'] }}   apt-get install --reinstall <package>  # reinstall it to restore the original
      {% elif (ansible_facts['os_family'] | ansible.builtin.lower) == 'suse' %}
      {{ __run_fail2ban_neutralize_item['value'] }}   rpm -qf '{{ __run_fail2ban_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_fail2ban_neutralize_item['value'] }}   zypper install --force <package>  # reinstall it to restore the original
      {% elif (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat' %}
      {{ __run_fail2ban_neutralize_item['value'] }}   rpm -qf '{{ __run_fail2ban_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_fail2ban_neutralize_item['value'] }}   dnf reinstall <package>  # reinstall it to restore the original
      {% else %}
      {{ __run_fail2ban_neutralize_item['value'] }}   Use your package manager to find the owning package and reinstall it.
      {% endif %}
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  when:
    - __run_fail2ban_paths_neutralize is ansible.builtin.defined
    - (__run_fail2ban_paths_neutralize | ansible.builtin.length) > 0
  loop: "{{ __run_fail2ban_paths_neutralize | ansible.builtin.dict2items }}"
  loop_control:
    loop_var: "__run_fail2ban_neutralize_item"
    label: "{{ __run_fail2ban_neutralize_item['key'] }}"
