# Uninstall: Manage basic resource removal, such as packages or service users.

---

# Fixed paths cover files written by releases without the ownership marker.
- name: "Setup | Uninstall | Remove drop-in configuration files created by the role"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "{{ __run_fail2ban_config_service_dropin_file_path }}"
    - "{{ __run_fail2ban_config_jail_dropin_file_path_default }}"
    - "{{ __run_fail2ban_config_service_dropin_file_path_default }}"
    - "{{ __run_fail2ban_config_jail_dropin_file_path }}"


- name: "Setup | Uninstall | Find files in the managed Fail2ban configuration directories"
  ansible.builtin.find:
    paths:
      - "{{ __run_fail2ban_config_service_dropin_dir_path }}"
      - "{{ __run_fail2ban_config_jail_dropin_dir_path }}"
      - "{{ __run_fail2ban_config_filter_dropin_dir_path }}"
      - "{{ __run_fail2ban_config_action_dropin_dir_path }}"
    file_type: "file"
    hidden: true
  register: __run_fail2ban_find_result


- name: "Setup | Uninstall | Determine files created by this role (ownership marker)"
  ansible.builtin.command:
    argv: >-
      {{
        [__run_fail2ban_grep_exec_path, '-l', '-s', '--', __run_fail2ban_config_file_marker]
        + (__run_fail2ban_find_result['files'] | ansible.builtin.map(attribute='path') | ansible.builtin.list)
      }}
  register: __run_fail2ban_owned_result
  changed_when: false
  failed_when:
    - __run_fail2ban_owned_result['rc'] not in [0, 1, 2]
  when:
    - (__run_fail2ban_find_result['files'] | ansible.builtin.length) > 0


- name: "Setup | Uninstall | Remove files created by this role"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: "{{ __run_fail2ban_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __run_fail2ban_packages_uninstall }}"
    state: "absent"
  when:
    - __run_fail2ban_packages_uninstall is ansible.builtin.defined
    - (__run_fail2ban_packages_uninstall | ansible.builtin.length) > 0
