# Handlers: Tasks that are triggered and run only when notified.

---

# Defined before the restart handler on purpose: handlers run in the order they
# are defined here, not in the order they are notified, so a broken
# configuration fails the run while the daemon keeps serving its previous one.
#
# "fail2ban-client -t" resolves the whole /etc/fail2ban tree and catches what
# actually breaks a restart in practice: malformed INI, unknown sections and
# jails referencing a filter or action that does not exist. It does not compile
# the "failregex" patterns, so a syntactically broken regex inside a custom
# filter still passes here.
- name: "Handlers | Validate Fail2ban configuration"
  ansible.builtin.command:
    argv:
      - "{{ __run_fail2ban_client_exec_path }}"
      - "-t"
  register: __run_fail2ban_validation_result
  changed_when:
    - false
  failed_when:
    - __run_fail2ban_validation_result is ansible.builtin.failed
  listen:
    - "run_fail2ban: validate configuration"


# "fail2ban-client -t" does not compile the failregex/ignoreregex patterns
# (see above), and the daemon even starts with a half-configured jail when a
# pattern is broken: the jail's setup stream aborts at the broken pattern, so
# it ends up without its log files and silently monitors nothing while
# fail2ban.service reports success. Compile every managed custom filter
# explicitly (against an empty log) so a broken pattern fails the run here,
# while the daemon keeps serving its previous configuration.
- name: "Handlers | Validate the managed custom filters (regex compilation)"
  ansible.builtin.command:
    argv:
      - "{{ __run_fail2ban_regex_exec_path }}"
      - "/dev/null"
      - "{{ __run_fail2ban_config_filter_dropin_dir_path }}/{{ item }}.local"
  changed_when:
    - false
  loop: "{{ (run_fail2ban_custom_filters | ansible.builtin.default({})).keys() | ansible.builtin.list }}"
  loop_control:
    label: "{{ item }}.local"
  listen:
    - "run_fail2ban: validate configuration"


- name: "Handlers | fail2ban.service restart"
  ansible.builtin.systemd_service:
    name: "{{ __run_fail2ban_fail2ban_servicename }}"
    state: "restarted"
  when:
    - run_fail2ban_service_state in ['enabled', 'running']
  listen:
    - "run_fail2ban: restart fail2ban.service"
